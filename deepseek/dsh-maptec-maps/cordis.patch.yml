# Maptec Maps DSH bundle: Streamable HTTP MCP + bundled maptec-maps skill.
- insert:
    - id: maptec-maps-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: maptec
        transport: streamable-http
        url: https://mcp.maptec.com/mcp
        headers:
          Accept: application/json, text/event-stream
          # Literal string at validate time; resolved at runtime via expandTemplates (env, .env, or credentials store).
          Authorization: '${credential:MAPTEC_API_KEY}'
        expandTemplates: true
    - id: maptec-maps-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        bundledSkillDir: ./skills